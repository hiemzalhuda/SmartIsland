name: Build APK (hiemz)

# Fork hiemz: simple debug build, no Telegram / signing secrets.
# Upstream's own build.yml also exists, but it runs lint + tests and tries
# to notify the author's Telegram; this one just builds and uploads the APK.
# Debug APK is installable (signed with the debug key) and matches the
# upstream README build: ./gradlew assembleDebug
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Upstream's gradlew is committed without the executable bit
      # (mode 100644), which is why the first run failed with
      # "./gradlew: Permission denied" — upstream's own build.yml chmods it.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartIsland-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
